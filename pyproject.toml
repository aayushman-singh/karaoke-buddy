[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karaoke-buddy"
version = "0.1.0"
description = "Sing any karaoke video in your own key - live pitch shift, vocal reduction, and one-click MP4 export."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Aayushman Singh", email = "aayushman2702@gmail.com" },
]
keywords = ["karaoke", "pitch-shift", "ffmpeg", "mpv", "yt-dlp", "qt", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "deno>=2.7.14",
    "PySide6>=6.6",
    "python-mpv>=1.0.6",
    "yt-dlp>=2025.11.12",
    "yt-dlp-ejs>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "hypothesis>=6.0",
    "Pillow>=10.0",
    "pyinstaller>=6.0",
    "ruff>=0.4",
]

[project.scripts]
karaoke-buddy = "karaoke_buddy.__main__:main"

[project.urls]
Homepage = "https://github.com/aayushman-singh/karaoke-buddy"
Repository = "https://github.com/aayushman-singh/karaoke-buddy"
Issues = "https://github.com/aayushman-singh/karaoke-buddy/issues"
Releases = "https://github.com/aayushman-singh/karaoke-buddy/releases"
Changelog = "https://github.com/aayushman-singh/karaoke-buddy/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke_buddy"]

[tool.ruff]
line-length = 100
target-version = "py311"
