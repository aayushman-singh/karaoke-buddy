[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karaoke-buddy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0.6",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "hypothesis>=6.0",
    "Pillow>=10.0",
    "pyinstaller>=6.0",
    "ruff>=0.4",
]

[project.scripts]
karaoke-buddy = "karaoke_buddy.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke_buddy"]
