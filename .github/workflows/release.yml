name: Release

# Builds KaraokeBuddy.exe on Windows and attaches it to the GitHub Release
# matching the pushed tag. Also dispatchable on demand for any existing tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build for, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # FFmpeg must include the rubberband filter (pitch shift). BtbN's GPL
      # build is the canonical source; the "latest" tag is a rolling alias.
      - name: Download FFmpeg (GPL build with rubberband)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bin
          url='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          curl -fsSL "$url" -o ffmpeg.zip
          7z x -y ffmpeg.zip -off >/dev/null
          cp ff/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe  build/bin/
          cp ff/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe build/bin/
          rm -rf ff ffmpeg.zip
          build/bin/ffmpeg.exe -hide_banner -filters | grep -q rubberband

      # libmpv-2.dll: shinchiro's mpv-winbuild publishes mpv-dev-x86_64-*.7z
      # in every release. Pick the most recent matching asset from /releases/latest.
      - name: Download libmpv (latest mpv-dev x86_64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_url=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest \
            | jq -r '.assets[] | select(.name | test("^mpv-dev-x86_64-[0-9].*\\.7z$")) | .browser_download_url' \
            | head -n1)
          if [[ -z "$asset_url" ]]; then
            echo "Could not locate mpv-dev-x86_64 asset in latest shinchiro release" >&2
            exit 1
          fi
          curl -fsSL "$asset_url" -o mpv-dev.7z
          7z x -y mpv-dev.7z -ompv-dev >/dev/null
          cp mpv-dev/libmpv-2.dll build/bin/
          rm -rf mpv-dev mpv-dev.7z

      - name: Build single-file EXE
        run: python build/build.py

      - name: Report build artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -la build/dist/KaraokeBuddy.exe
          sha256sum build/dist/KaraokeBuddy.exe

      - name: Upload build artifact (for dispatch runs and debugging)
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeBuddy-windows
          path: build/dist/KaraokeBuddy.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/dist/KaraokeBuddy.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
