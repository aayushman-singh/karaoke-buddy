name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      # PySide6's QtGui dynamically links libEGL/libGL even under the
      # offscreen platform plugin, so importing it fails on bare runners
      # with "libEGL.so.1: cannot open shared object file". Install the
      # system OpenGL/EGL/xkb libraries Qt needs to load.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
            libdbus-1-3 libxcb-cursor0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run non-FFmpeg tests
        # Export integration tests depend on the runner's FFmpeg build and
        # available filters. Everything else, including the Qt launch smoke
        # path, should be deterministic in CI.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --ignore=tests/test_exporter.py -v
