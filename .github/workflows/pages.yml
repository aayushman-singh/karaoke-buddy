name: Deploy Pages

# Publishes the landing page at the site root and the static web demo at
# /demo/. Going live also requires Pages to be enabled in repo settings;
# this workflow only builds and deploys the artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege tokens required by the official Pages deploy flow.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Assemble site
        # Landing page (+ optional landing assets) goes to the root; the
        # static web demo is copied verbatim into a /demo/ subfolder, then
        # every *.md is stripped from the demo tree so vendor/demo README
        # files (and any placeholder tokens they contain) never ship to the
        # public site. LICENSE files are kept (LGPL travels with the dist).
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp docs/index.html _site/
          if [ -d docs/landing ]; then
            cp -R docs/landing _site/landing
          fi
          mkdir -p _site/demo
          cp -R apps/web-demo/. _site/demo/
          find _site/demo -type f -name '*.md' -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
